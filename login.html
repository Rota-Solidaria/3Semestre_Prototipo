<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Rota Solidária</title>
  <link rel="stylesheet" href="css/site.css">
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Rota <span>Solidária</span></a>
      <nav class="nav">
        <a class="" href="index.html">Início</a>
        <a class="" href="campanhas.html">Campanhas</a>
        <a class="" href="educativo.html">Saiba Mais</a>
      </nav>
      <div class="header-actions">
        <a class="icon-btn" href="#acessibilidade" aria-label="Acessibilidade">A</a>
        <a class="profile" href="login.html">Perfil</a>
      </div>
    </div>
    <div class="mobile-nav container">
      <a href="index.html">Início</a>
      <a href="campanhas.html">Campanhas</a>
      <a href="educativo.html">Saiba Mais</a>
      <a href="login.html">Perfil</a>
    </div>
  </header>
  <main class="container">
    <section class="success" style="max-width:480px">
      <div class="panel" style="text-align:left">
        <div class="kicker">Acesso</div>
        <h1>Entrar</h1>
        <p class="muted">Acesse seu perfil para acompanhar suas inscrições.</p>
        <form action="campanhas.html">
          <div class="field"><label>E-mail</label><input type="email" required placeholder="seu@email.com"></div>
          <div class="field" style="margin-top:16px"><label>Senha</label><input type="password" required
              placeholder="••••••••"></div><button class="btn btn-primary" style="width:100%;margin-top:22px"
            type="submit">Entrar</button>
        </form>
        <p class="muted" style="text-align:center;margin-top:18px">Ainda não possui cadastro? <a
            href="inscrever-campanha.html" style="color:var(--brand);font-weight:800">Continuar sem cadastro</a></p>
      </div>
    </section>
  </main>
  <footer class="footer">
    <div class="container footer-inner">
      <strong>♥ Rota Solidária <span>© 2026</span></strong>
      <span>Projeto de Extensão - Angatuba e Região</span>
    </div>
  </footer>
</body>

</html>
